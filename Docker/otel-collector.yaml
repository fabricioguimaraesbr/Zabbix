receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/zabbix:
    endpoint: zabbix-apm-proxy:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/zabbix]
    metrics:
      receivers: [otlp]
      exporters: [otlp/zabbix]
    logs:
      receivers: [otlp]
      exporters: [otlp/zabbix]
