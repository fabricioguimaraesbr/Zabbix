services:
  zabbix-apm-proxy:
    image: zabbix-proxy-apm:alpine-trunk
    build:
      context: ./zabbix-apm-proxy
    command: ["/usr/sbin/zabbix_proxy", "--foreground", "-c", "/etc/zabbix/zabbix_proxy_custom.conf"]
    volumes:
      - '/Users/fabricio/VSCode/docker-volume/zabbix-apm-proxy:/var/lib/zabbix/db_data'
      - ./zabbix_proxy.conf:/etc/zabbix/zabbix_proxy_custom.conf:ro
    networks:
      - network-zabbix
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - network-zabbix
    depends_on:
      - zabbix-apm-proxy
    restart: unless-stopped

  login-app:
    build:
      context: ./login-app
    environment:
      APP_USERNAME: ${APP_USERNAME:-demo}
      APP_PASSWORD: ${APP_PASSWORD:?Configure APP_PASSWORD in Docker/.env}
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET in Docker/.env}
      OTEL_SERVICE_NAME: zabbix-login-demo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - '8080:8080'
    networks:
      - network-zabbix
    depends_on:
      - otel-collector
    restart: unless-stopped

networks:
  network-zabbix:
    name: zabbix-network
    external: true
